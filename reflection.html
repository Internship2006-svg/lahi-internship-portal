<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mission 4 - Daily Reflection</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

.student-nav {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    background: white;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
}

.student-nav a,
.student-nav button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    background: #f1f3f5;
    color: #222;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px 60px;
}

.hero {
    background: linear-gradient(135deg, #00a896, #02c39a);
    color: white;
    padding: 35px;
    border-radius: 25px;
    margin-bottom: 25px;
}

.day-card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    margin-top: 8px;
    margin-bottom: 15px;
    min-height: 90px;
    font-size: 15px;
}

.save-btn,
.complete-btn {
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    background: #e8f8f5;
}

.complete-btn {
    width: 100%;
    background: #222;
    color: white;
    font-size: 16px;
    margin-top: 15px;
}

.status {
    font-size: 13px;
    font-weight: bold;
}

.progress-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.bar {
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.bar-fill {
    height: 100%;
    width: 0%;
    background: #00a896;
}

</style>

</head>


<body>


<nav class="student-nav">

<a href="index.html">
🏠 Home
</a>

<a href="journey.html">
🗺️ My Journey
</a>

<button onclick="history.back()">
← Back
</button>

</nav>


<div class="container">


<div class="hero">

<div>MISSION 4</div>

<h1>📔 Daily Reflection</h1>

<p>
Take a few minutes after each internship day
to think about what happened and what you learned.
</p>

</div>


<div class="progress-box">

<strong id="progressText">
0 of 15 days completed
</strong>

<div class="bar">

<div
class="bar-fill"
id="progressBar">
</div>

</div>

</div>


<div id="days"></div>


<button
class="complete-btn"
onclick="completeReflection()">

🎉 COMPLETE MISSION 4

</button>


</div>


<script src="progress.js"></script>


<script>

const daysContainer =
document.getElementById("days");


for(let day = 1; day <= 15; day++) {

    const saved =
        localStorage.getItem(
            "lahi_reflection_" + day
        ) || "";


    const card =
        document.createElement("div");

    card.className = "day-card";


    card.innerHTML = `

        <div class="day-header">

            <h2>📅 Day ${day}</h2>

            <span
            class="status"
            id="status-${day}">
            </span>

        </div>


        <label>
        What happened today?

        <textarea
        id="happened-${day}"
        placeholder="Write about your day..."
        >${saved ? saved : ""}</textarea>

        </label>


        <label>
        What did I learn?

        <textarea
        id="learned-${day}"
        placeholder="What did you learn today?"
        ></textarea>

        </label>


        <label>
        Why is it important?

        <textarea
        id="important-${day}"
        placeholder="Why is this learning important?"
        ></textarea>

        </label>


        <button
        class="save-btn"
        onclick="saveDay(${day})">

        💾 Save Day ${day}

        </button>

    `;


    daysContainer.appendChild(card);

}


function saveDay(day) {

    const happened =
        document.getElementById(
            "happened-" + day
        ).value.trim();


    const learned =
        document.getElementById(
            "learned-" + day
        ).value.trim();


    const important =
        document.getElementById(
            "important-" + day
        ).value.trim();


    if(
        happened === "" ||
        learned === "" ||
        important === ""
    ) {

        alert(
            "Please answer all 3 reflection questions."
        );

        return;
    }


    const data = {

        happened: happened,

        learned: learned,

        important: important

    };


    localStorage.setItem(
        "lahi_reflection_" + day,
        JSON.stringify(data)
    );


    document.getElementById(
        "status-" + day
    ).innerText = "✓ Saved";


    updateProgress();

}


function updateProgress() {

    let completed = 0;


    for(let day = 1; day <= 15; day++) {

        if(
            localStorage.getItem(
                "lahi_reflection_" + day
            )
        ) {

            completed++;

            const status =
                document.getElementById(
                    "status-" + day
                );

            if(status) {
                status.innerText = "✓ Saved";
            }

        }

    }


    document.getElementById(
        "progressText"
    ).innerText =
        completed + " of 15 days completed";


    document.getElementById(
        "progressBar"
    ).style.width =
        (completed / 15 * 100) + "%";

}


function completeReflection() {

    let completed = 0;


    for(let day = 1; day <= 15; day++) {

        if(
            localStorage.getItem(
                "lahi_reflection_" + day
            )
        ) {

            completed++;

        }

    }


    /*
       We do not force all 15 days here.
       A student may have a shorter internship.
       They can complete the mission after
       recording at least one reflection.
    */


    if(completed === 0) {

        alert(
            "Please complete at least one daily reflection before finishing this mission."
        );

        return;
    }


    completeMission(4);


    alert(
        "🎉 Mission 4 complete! Mission 5 is now unlocked."
    );


    window.location.href =
        "journey.html";

}


updateProgress();

</script>


</body>

</html>
